name: Publish (npm + MCP registry)

# Why this exists: publishing was 100% manual. `npm publish` got run, the
# `mcp-publisher` step got forgotten — so npm reached 0.26.0 while the official
# MCP registry (which PulseMCP/Glama/etc. mirror) stayed frozen at 0.2.2 with a
# stale "30+ AI models" blurb since January. This automates BOTH targets with
# independent version guards, so they can never drift apart again.

on:
  push:
    branches: [main]
    paths:
      - "package.json"        # only run when the version could have changed
      - "server.template.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:          # manual trigger (e.g. to unstick the registry)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to push the tag + create the GitHub release
      id-token: write          # required for `mcp-publisher login github-oidc`
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve versions
        id: v
        run: |
          PKG=$(node -p "require('./package.json').version")
          NPM=$(npm view @blockrun/mcp version 2>/dev/null || echo "none")
          # `version=latest` is load-bearing. Without it the search endpoint pages
          # at 30 results with every isLatest=false, so the old `|| a[a.length-1]`
          # fallback returned the last row of PAGE ONE — 0.32.8, frozen since July —
          # and called it the current registry version.
          #
          # That was wrong on every run, but it only SHOWED on the runs where it
          # mattered. On a real release pkg is genuinely new, so `pkg != reg` was
          # true for the wrong reason and the publish succeeded anyway. The bug
          # bites when package.json changes WITHOUT a version bump (a dependency
          # pin, an override): npm is correctly skipped, then the registry step
          # fires on a stale comparison and 400s with "cannot publish duplicate
          # version" — a red release job with nothing actually wrong.
          #
          # With the parameter the endpoint returns exactly one row, the real
          # latest, isLatest=true.
          REG=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.BlockRunAI/blockrun-mcp&version=latest" \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const a=j.servers||[];console.log(a[0]?.server?.version||'none')}catch{console.log('none')}})")
          echo "pkg=$PKG"  >> "$GITHUB_OUTPUT"
          echo "npm=$NPM"  >> "$GITHUB_OUTPUT"
          echo "reg=$REG"  >> "$GITHUB_OUTPUT"
          echo "package.json=$PKG | npm=$NPM | registry=$REG"

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck, test
        run: |
          npm run build
          npm run typecheck
          npm test

      # ---- npm ----
      - name: Publish to npm
        if: steps.v.outputs.pkg != steps.v.outputs.npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm (already published)
        if: steps.v.outputs.pkg == steps.v.outputs.npm
        run: echo "npm already at ${{ steps.v.outputs.pkg }} — skipping npm publish"

      # ---- MCP registry ----
      - name: Install mcp-publisher
        if: steps.v.outputs.pkg != steps.v.outputs.reg
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Stamp + publish server.json to MCP registry
        if: steps.v.outputs.pkg != steps.v.outputs.reg
        run: |
          node scripts/stamp-server-json.mjs
          mcp-publisher validate
          mcp-publisher login github-oidc
          mcp-publisher publish
          echo "Published $(node -p "require('./package.json').name")@${{ steps.v.outputs.pkg }} to the MCP registry"

      - name: Skip registry (already published)
        if: steps.v.outputs.pkg == steps.v.outputs.reg
        run: echo "registry already at ${{ steps.v.outputs.pkg }} — skipping"

      # ---- git tag + GitHub release ----
      # These used to be manual, and manual meant forgotten: 0.32.1 and 0.32.2
      # both reached npm and the MCP registry with no tag and no release entry,
      # because `npm view` showing the new version looks exactly like success.
      # Same independent-guard shape as the two publishes above — it checks
      # whether the tag already exists rather than assuming, so re-runs and
      # workflow_dispatch are safe.
      # Gated on the same version diff as the npm publish above. Without it, a
      # push that only touched publish.yml (or a workflow_dispatch) would tag
      # HEAD and title the release from an unrelated commit subject — precisely
      # in the "release is missing" state this automation exists to repair.
      - name: Tag + GitHub release
        if: steps.v.outputs.pkg != steps.v.outputs.npm
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.pkg }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi

          # Release notes come from the CHANGELOG entry that was already written,
          # so the release and the CHANGELOG can never drift apart. If the entry
          # is missing, say so plainly rather than publishing an empty release.
          if ! node scripts/changelog-section.mjs "$VERSION" > /tmp/notes.md; then
            echo "See CHANGELOG.md for details." > /tmp/notes.md
          fi

          # Title convention is "vX.Y.Z — <headline>", and the headline already
          # exists as the squash-merge subject on main. Strip its "(#NN)" suffix.
          SUBJECT=$(git log -1 --format=%s)
          HEADLINE=$(printf '%s' "$SUBJECT" | sed -E 's/ \(#[0-9]+\)$//; s/^v?[0-9]+\.[0-9]+\.[0-9]+ (— )?//')
          if [ -z "$HEADLINE" ] || [ "$HEADLINE" = "$SUBJECT" ]; then
            TITLE="$TAG"
          else
            TITLE="$TAG — $HEADLINE"
          fi

          # Annotated tags need a committer identity, and the runner has none:
          # `git tag -a` died with "fatal: empty ident name", failing the job
          # AFTER npm and the MCP registry had already published — 0.32.3 shipped
          # with no tag and no release and had to be repaired by hand. This is
          # exactly the drift the step exists to prevent.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ask the REMOTE, not the local clone: actions/checkout fetches no tags
          # by default, so `git rev-parse "$TAG"` always missed and the push ran
          # unconditionally. An annotated tag already on origin is then rejected
          # as non-fast-forward, and `set -e` fails the job AFTER npm and the
          # registry have already published — the worst place to fail.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already on origin — not re-pushing"
          else
            git tag -a "$TAG" -m "$TITLE"
            git push origin "$TAG"
          fi

          # No --target: GitHub rejects target_commitish for a tag that already
          # exists ("Release.target_commitish is invalid"), and by this point the
          # tag always exists — we either just pushed it or found it on origin.
          # The release inherits the tag's commit, which is what we wanted anyway.
          gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md --latest
          echo "Released $TAG"
