name: CI

# publish.yml already builds, typechecks and tests — but only on push to main,
# which is after a merge. Nothing gated the pull request itself, so a change
# could only be found to be broken once it was already on main and mid-release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fails when a number in the docs disagrees with brand-numbers.json.
      # Offline by design: it reads the committed snapshot and never fetches, so
      # a blockrun.ai deploy in progress cannot fail this repo's CI.
      - name: Brand numbers
        run: node scripts/sync-brand-numbers.mjs --check
