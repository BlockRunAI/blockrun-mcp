name: CI

# publish.yml already builds, typechecks and tests — but only on push to main,
# which is after a merge. Nothing gated the pull request itself, so a change
# could only be found to be broken once it was already on main and mid-release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json says `engines.node >=20.19` and the README carries the badge,
  # but until this matrix existed every check ran on Node 22 only. A dependency
  # reaching for a 22-only API (Promise.withResolvers, Set.prototype.union) would
  # have shipped green and broken on the oldest Node the package claims to
  # support. 20.19 is the floor: mock.module (which `npm test` needs) landed in
  # 20.18, and vite 8 / rolldown (the pretest MCP Apps build) require ^20.19.
  test-node:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # publish.yml runs build alongside typecheck and test, and this gate is
      # meant to move that same trio earlier — the header above says as much —
      # but build was missing, so a tsup/dts break still only surfaced on main
      # mid-release.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 0.32.3 shipped with sharp imported at the top level. sharp is an
      # optionalDependency, so wherever it is absent — musl, unusual arch,
      # offline CI, --no-optional — ESM resolution failed before main() ran and
      # all 19 tools went with it, while build, typecheck and test stayed green.
      # Loading the built entrypoint is the only thing that catches that class.
      #
      # sharp is deleted rather than installed around with --omit=optional:
      # that also strips rollup's platform binary, so tsup cannot run at all,
      # which is a failure of the build toolchain rather than of this package.
      - name: CLI loads without sharp
        run: |
          rm -rf node_modules/sharp
          test "$(node dist/index.js --version)" = "$(node -p 'require("./package.json").version')"

      # Fails when a number in the docs disagrees with brand-numbers.json.
      # Offline by design: it reads the committed snapshot and never fetches, so
      # a blockrun.ai deploy in progress cannot fail this repo's CI.
      - name: Brand numbers
        run: node scripts/sync-brand-numbers.mjs --check

  # Branch protection on main requires a status check named exactly `test`.
  # A matrix job reports one check per leg ("test (node 20.19)", "test (node
  # 22)") and never one called `test`, so without this gate every PR would sit
  # unmergeable waiting for a check that can no longer arrive. `if: always()`
  # makes it run even when a leg fails, so the failure is reported as a red
  # `test` rather than a check that never completes.
  test:
    needs: test-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Node versions passed
        run: test "${{ needs.test-node.result }}" = "success"
